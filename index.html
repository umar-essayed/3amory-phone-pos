<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3amory phone | نظام إدارة ومبيعات الهواتف والمحافظ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=El+Messiri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-blue-600 selection:text-white" style="margin: 0; background-color: #0f172a;">
    <div id="root">
      <!-- Instant Desktop / Web Loading Splash (Prevents any blank white screen) -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background-color: #0f172a; color: #ffffff; font-family: 'Cairo', system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; box-sizing: border-box; user-select: none;">
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <!-- Glowing Spinning Ring -->
          <div style="width: 88px; height: 88px; border-radius: 50%; border: 4px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-right-color: #60a5fa; animation: posSpin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;"></div>
          <!-- Center Emblem -->
          <div style="position: absolute; width: 58px; height: 58px; background: linear-gradient(135deg, #2563eb, #1e40af); border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="2" width="14" height="20" rx="3" ry="3"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
          </div>
        </div>

        <h1 style="margin: 0 0 8px 0; font-size: 28px; font-weight: 900; letter-spacing: -0.5px; color: #f8fafc; font-family: 'El Messiri', 'Cairo', sans-serif;">3amory phone</h1>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 28px;">
          <span style="height: 8px; width: 8px; border-radius: 50%; background-color: #10b981; box-shadow: 0 0 8px #10b981;"></span>
          <span style="font-size: 14px; color: #94a3b8; font-weight: 600;">نظام إدارة ومبيعات الهواتف والمحافظ المتكامل</span>
        </div>

        <!-- Animated Progress Indicator -->
        <div style="width: 260px; height: 6px; background-color: #1e293b; border-radius: 9999px; overflow: hidden; position: relative; margin-bottom: 16px; border: 1px solid rgba(255, 255, 255, 0.05);">
          <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 45%; background: linear-gradient(90deg, #3b82f6, #60a5fa); border-radius: 9999px; animation: posProgress 1.4s ease-in-out infinite;"></div>
        </div>

        <p style="margin: 0; font-size: 13px; color: #64748b; font-weight: 600;">جاري تشغيل البيئة وقاعدة البيانات المحلية...</p>
      </div>

      <style>
        @keyframes posSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes posProgress {
          0% { left: -45%; width: 35%; }
          50% { width: 65%; }
          100% { left: 100%; width: 35%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
